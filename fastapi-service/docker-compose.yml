services:
  prompt-enhancer:
    build: .
    image: flux-prompt-enhancer:latest
    container_name: flux-prompt-enhancer
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      MODEL_ID: ${MODEL_ID:-imranali291/flux-prompt-enhancer}
      HF_TOKEN: ${HF_TOKEN:-}
      DEVICE: ${DEVICE:-}
      ROOT_PATH: ${ROOT_PATH:-}
      TRANSLATION_API_URL: ${TRANSLATION_API_URL:-https://ai-app-studio.var-meta.com/ai-summary/api/translate}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_TIMEOUT_SECONDS: ${TRANSLATION_TIMEOUT_SECONDS:-30}
    volumes:
      - hf-cache:/app/.cache/huggingface
    # Uncomment to enable GPU (requires nvidia-container-toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
